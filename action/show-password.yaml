# yaml-language-server: $schema=./action-schema-1.json
kind: form
dialog:
  title: Temporary password
  description: "Shown only once. Give it to the user; they must change it at first login."
  confirm_label: Done
form:
  fields:
    - { name: email, type: string, label: User, readonly: true }
    - { name: password, type: string, label: Temporary password, readonly: true }
