# yaml-language-server: $schema=./view-schema-1.json
# One environment of one flag (spec 05 screen 3): switch + default rule, read-only; the flag
# page's Edit button changes them in a dialog. The brand overrides are their own box on the
# flag page. Everything reads live tables, so changes from anywhere show without refreshing.
args:
  flag: { type: string, required: true }
  env: { type: string, required: true }
body:
  - kind: label
    observe: { script: 'scenery("flag_env").where("id", args.flag + "@" + args.env)' }
    params: { text: "", column: heading, style: heading }
  - kind: label
    observe: { script: 'scenery("env_override_count").args(#{ scope: args.flag + "@" + args.env })' }
    params: { text: "No brand overrides", column: summary, style: muted }
  - kind: label
    observe: { script: 'scenery("flag_env").where("id", args.flag + "@" + args.env)' }
    params: { text: "", column: rule_text }
