# yaml-language-server: $schema=./table-schema-1.json
# Web: archived flags (spec 05 screen 4), read-only (a query table, so the API refuses
# writes). Revive goes through web_flag_edit, permanent delete through web_flag_delete (admins).
datasource: flags
title: Archived flags (web, read)
columns:
  id: { type: string, flags: [id] }
  name: { type: string, flags: [title] }
  description: { type: string }
  archived_at: { type: timestamp }
  archived_by: { type: string }
  # for the archived flag's own (read-only) page
  tags: { type: string }
  stale: { type: bool }
  development: { type: string }
  uat: { type: string }
  production: { type: string }
  created_at: { type: timestamp }
  created_by: { type: string }
surreal:
  rhai: |
    surreal::select()
        .from("flag")
        .field("id").field("name").field("description").field("archived_at").field("archived_by")
        .field("tags").field("stale").field("development").field("uat").field("production")
        .field("created_at").field("created_by")
        .where(surreal::ident("archived") == true)
