# yaml-language-server: $schema=./table-schema-1.json
# Web: the settings every signed-in person needs (the "not seen in N days" filter and its
# reliability note). Read-only through the API; admins edit them through web_settings.
datasource: flags
title: Config (web, read)
columns:
  id: { type: string, flags: [id] }
  unused_flag_days: { type: int, flags: [title] }
  usage_recording_since: { type: timestamp }
  brand_context_field: { type: string }
  customer_context_field: { type: string }
surreal:
  table: settings
