# yaml-language-server: $schema=./table-schema-1.json
# Web: the audit log. Read-only through the API (`read_only: true` in api/flags.yaml): a
# signed-in person must not add a made-up entry (the database only stops changes and deletes).
datasource: flags
title: Audit log (web, read)
columns:
  id: { type: string, flags: [id] }
  created_at: { type: timestamp }
  created_by: { type: string }
  type: { type: string }
  flag: { type: string }
  environment: { type: string }
  brand: { type: string }
  summary: { type: string, flags: [title] }
  pre_data: { type: string }
  data: { type: string }
surreal:
  table: audit_event
