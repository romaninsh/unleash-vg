# yaml-language-server: $schema=./table-schema-1.json
# Web: every flag name the audit log mentions - live, archived and deleted flags - for the
# audit log's flag picker. Read-only (a query table, grouped; one row per name).
datasource: flags
title: Flag names in the audit log (web, read)
columns:
  id: { type: string, flags: [id] }
  name: { type: string, flags: [title] }
  events: { type: int }
surreal:
  rhai: |
    surreal::select()
        .from(
            surreal::select()
                .from("audit_event")
                .expression(surreal::expr("flag").alias("name"))
                .expression(surreal::expr("count()").alias("events"))
                .where(surreal::ident("flag") != surreal::expr("NONE"))
                .group_by(surreal::ident("name"))
                .subquery())
        .expression(surreal::fx("type::record", [surreal::expr("'flag_name'"), surreal::ident("name")]).alias("id"))
        .field("name").field("events")
        .where(surreal::ident("name") != surreal::expr("NONE"))
