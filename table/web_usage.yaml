# yaml-language-server: $schema=./table-schema-1.json
# Web: a flag's yes/no counts per hour, environment and app, as the SDK service records them
# (kept for the metrics retention in Settings). Read-only; the flag page's Usage card adds up
# the last 24 hours and 7 days.
datasource: flags
title: Flag usage per hour (web, read)
columns:
  id: { type: string, flags: [id] }
  flag: { type: string, flags: [title] }
  environment: { type: string }
  app_name: { type: string }
  hour: { type: timestamp }
  "yes": { type: int }
  "no": { type: int }
surreal:
  table: metric_hourly
