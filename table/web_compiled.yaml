# yaml-language-server: $schema=./table-schema-1.json
# Web: what SDKs receive for one flag x environment (fn::compile), for the flag page's preview.
# Reads flag_env directly so one card computes one row. READ-ONLY BY NAMING, like web_env:
# `served` matches no stored field, and flag_name/env_key are computed by the database.
datasource: flags
title: Compiled feature (web, read)
columns:
  id: { type: string, flags: [id] }
  flag_name: { type: string, flags: [title], expr: 'expr("flag_name")' }
  env_key: { type: string, expr: 'expr("env_key")' }
  served: { type: string, expr: 'expr("encoding::json::encode(fn::compile(id))")' }
surreal:
  table: flag_env
