# yaml-language-server: $schema=./table-schema-1.json
# Web: what SDKs receive for one flag x environment, for the flag page's preview. Read from
# the flag service, which compiles and serves it.
datasource: flag_service
title: Compiled feature (web, read)
table: internal/features
columns:
  id: { type: string, flags: [id] }
  flag_name: { type: string, flags: [title] }
  env_key: { type: string }
  feature: { type: string }
