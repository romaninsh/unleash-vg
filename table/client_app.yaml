# yaml-language-server: $schema=./table-schema-1.json
# Connected apps (spec 05 screen 6): one row per app x environment x SDK version.
datasource: flags
title: Connected apps
columns:
  id: { type: string, flags: [id, hidden] }
  app_name: { label: App, type: string, flags: [title, searchable] }
  environment: { type: string }
  sdk_version: { label: SDK version, type: string }
  instances: { type: int }
  last_seen_at: { label: Last seen, type: timestamp }
surreal:
  rhai: |
    surreal::select()
        .from(
            surreal::select()
                .field("app_name")
                .field("environment")
                .expression(surreal::expr("sdk_version ?? 'unknown'").alias("sdk_version"))
                .expression(surreal::count().alias("instances"))
                .expression(surreal::fx("time::max", [surreal::ident("last_seen_at")]).alias("last_seen_at"))
                .from("client_app")
                .group_by(surreal::ident("app_name"))
                .group_by(surreal::ident("environment"))
                .group_by(surreal::ident("sdk_version"))
                .subquery())
        .expression(surreal::fx("type::record", [surreal::expr("'client_app_group'"), surreal::expr("app_name + ':' + environment + ':' + sdk_version")]).alias("id"))
        .field("app_name").field("environment").field("sdk_version").field("instances").field("last_seen_at")
        .order_by(surreal::ident("app_name"), "asc")
