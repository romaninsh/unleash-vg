# yaml-language-server: $schema=./table-schema-1.json
# Web: brand overrides. Read-only through the API; ids stay brand_override:..., which the page
# hands to override_edits.
datasource: flags
title: Brand overrides (web, read)
columns:
  id: { type: string, flags: [id] }
  scope: { type: string }
  env_key: { type: string }
  brand: { type: string, flags: [hidden, calculated], references: { table: brand, kind: has_one, name: brand } }
  brand.key: { type: string }
  brand.display_name: { type: string }
  brand.active: { type: bool }
  rollout: { type: int }
  allowlist: { type: string }
  rule_label: { type: string, lazy: !include ../script/rule_label.rhai }
  # plain names for the web client
  brand_key: { type: string, lazy: 'row["brand.key"]' }
  brand_name: { type: string, flags: [title], lazy: 'row["brand.display_name"]' }
  brand_active: { type: bool, lazy: 'row["brand.active"]' }
surreal:
  table: brand_override
