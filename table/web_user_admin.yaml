# yaml-language-server: $schema=./table-schema-1.json
# Web admin: users (spec 05 screen 9). The web API scopes it to admins (admin_scope).
# A create or reset sends a temporary password once in new_password; only its hash is kept.
datasource: flags
title: Users (web admin)
columns:
  id: { type: string, flags: [id] }
  name: { type: string, flags: [title] }
  email: { type: string }
  role: { type: string }
  editable_environments: { type: string }
  active: { type: bool }
  must_change_password: { type: bool }
  new_password: { type: string }
  admin_scope: { type: string }
  last_login_at: { type: timestamp, flags: [calculated] }
  password_changed_at: { type: timestamp, flags: [calculated] }
surreal:
  table: app_user
log_changes:
  into: audit_event
  exclude: [password_hash]   # new_password: log_user.rhai never writes it, see there
  columns: { who: created_by, at: created_at, before: pre_data, after: data }
  script: !include ../script/log_user.rhai
