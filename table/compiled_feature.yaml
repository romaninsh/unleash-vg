# yaml-language-server: $schema=./table-schema-1.json
# What SDKs receive per flag x environment (spec 03/04), as the flag service compiled it.
# Archived flags are not served, so not listed.
datasource: flag_service
title: SDK output
table: internal/features
columns:
  id: { type: string, flags: [id, hidden] }
  flag_name: { label: Flag, type: string, flags: [title] }
  env_key: { label: Environment, type: string }
  enabled: { label: Switch, type: bool }
  served_enabled: { label: Served as enabled, type: bool }
  feature: { label: JSON sent to apps, type: string }
