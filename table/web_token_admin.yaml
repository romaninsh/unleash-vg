# yaml-language-server: $schema=./table-schema-1.json
# Web admin: API tokens (spec 05 screen 8). The web API scopes it to admins (admin_scope).
# A create sends the secret once in new_secret; the database keeps only its hash, lookup and hint.
datasource: flags
title: API tokens (web admin)
columns:
  id: { type: string, flags: [id] }
  name: { type: string, flags: [title] }
  type: { type: string }
  environment: { type: string }
  # environment reads back as the record id environment:<key>
  env_key: { type: string, lazy: 'let e = `${row.environment ?? ""}`; e.sub_string(e.index_of(":") + 1)' }
  source: { type: string }
  hint: { type: string }
  created_by: { type: string }
  created_at: { type: timestamp, flags: [calculated] }
  last_used_at: { type: timestamp, flags: [calculated] }
  new_secret: { type: string }
  admin_scope: { type: string }
surreal:
  table: api_token
log_changes:
  into: audit_event
  exclude: [new_secret, secret_hash, lookup]
  columns: { who: created_by, at: created_at, before: pre_data, after: data }
  script: !include ../script/log_token.rhai
