# The SDK API (service/, the flag service) to Cloud Run as unleash-vg-sdk, on every merge to main
# that changes it. Auth: Workload Identity Federation as github-unleash-vg (vantage-terraform's
# module "unleash_vg"); secrets from Secret Manager, never the image or this repository.
name: deploy-sdk

on:
  push:
    branches: [main]
    paths:
      - 'service/**'
      - '.github/workflows/deploy-sdk.yaml'
  workflow_dispatch:

permissions: {}

# A second merge waits for the running deploy; neither is cancelled.
concurrency:
  group: deploy-sdk
  cancel-in-progress: false

env:
  PROJECT: inlaid-agility-461020-e4
  REGION: europe-west2
  SERVICE: unleash-vg-sdk
  IMAGE: europe-west2-docker.pkg.dev/inlaid-agility-461020-e4/cloud-run-source-deploy/unleash-vg-sdk
  # Cloud Run's deterministic URL for the service (<name>-<project number>.<region>.run.app)
  URL: https://unleash-vg-sdk-129027965449.europe-west2.run.app

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/129027965449/locations/global/workloadIdentityPools/golf/providers/unleash-vg-main
          service_account: github-unleash-vg@inlaid-agility-461020-e4.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push the image
        run: |
          gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" service
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      # Scales to zero, one instance at most, CPU billed only while a request runs. The flag
      # service's refresh and metrics flush run between requests only while an instance is up.
      - name: Deploy
        env:
          SURREAL_NS: ${{ vars.SURREAL_NS }}
          SURREAL_DB: ${{ vars.SURREAL_DB }}
        run: |
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE:$GITHUB_SHA" \
            --service-account "unleash-vg-runtime@$PROJECT.iam.gserviceaccount.com" \
            --min-instances 0 --max-instances 1 --cpu 1 --memory 256Mi --cpu-boost \
            --network default --subnet default --vpc-egress all-traffic \
            --port 4380 \
            --set-env-vars "SURREAL_NS=$SURREAL_NS,SURREAL_DB=$SURREAL_DB,SURREAL_AUTH=database" \
            --set-secrets "SURREAL_URL=unleash-vg-surreal-endpoint:latest,SURREAL_USER=unleash-vg-surreal-user:latest,SURREAL_PASS=unleash-vg-surreal-pass:latest,INTERNAL_TOKEN=unleash-vg-internal-token:latest"

      # An ID token for the service, so the check passes before the service is public too.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: invoker
        with:
          workload_identity_provider: projects/129027965449/locations/global/workloadIdentityPools/golf/providers/unleash-vg-main
          service_account: github-unleash-vg@inlaid-agility-461020-e4.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ env.URL }}
          id_token_include_email: true
      - name: Smoke check
        env:
          ID_TOKEN: ${{ steps.invoker.outputs.id_token }}
        run: |
          body="$(curl -sS -m 30 -H "Authorization: Bearer $ID_TOKEN" "$URL/health")"
          echo "$URL/health: $body"
          [ "$body" = '{"health":"GOOD"}' ]
