# yaml-language-server: $schema=./table-schema-1.json
# Web: flag names apps ask for that don't exist (usually typos). Read-only through the API.
datasource: flags
title: Unknown flag names (web, read)
columns:
  id: { type: string, flags: [id] }
  name: { type: string, flags: [title] }
  environment: { type: string }
  app_name: { type: string }
  count: { type: int }
  last_seen_at: { type: timestamp }
surreal:
  table: unknown_flag
