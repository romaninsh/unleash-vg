# yaml-language-server: $schema=./table-schema-1.json
# Web: one flag x environment, read-only for everyone (the API entity is `read_only: true`;
# changes go through environment_edits). Reads flag_env directly (index on flag_name, env_key),
# so only the requested rows are computed.
datasource: flags
title: Flag environments (web, read)
columns:
  id: { type: string, flags: [id] }
  flag_name: { type: string, flags: [title] }
  env_key: { type: string }
  enabled: { type: bool }
  default_rollout: { type: int }
  default_allowlist: { type: string }
  revision: { type: int }
  default_label: { type: string, lazy: !include ../script/rule_label.rhai }
  last_seen: { type: string, flags: [hidden, calculated], references: { table: flag_last_seen, kind: has_one, name: last_seen } }
  last_seen.last_seen_at: { type: timestamp }
  # the same date under a plain name, for the web client
  seen_at: { type: timestamp, lazy: 'row["last_seen.last_seen_at"]' }
surreal:
  table: flag_env
