# yaml-language-server: $schema=./table-schema-1.json
# The audit log. Vantage writes it for tables with `log_changes:` (brands so far); the database
# rules (tests/events.surql) write the rest. Can't be changed or deleted.
datasource: flags
title: Audit log
columns:
  id: { type: string, flags: [id, hidden] }
  created_at: { label: Time, type: timestamp, time_precision: minutes }
  created_by: { label: User, type: string, flags: [searchable] }
  type: { label: Event, type: string }
  flag: { type: string, flags: [searchable] }
  environment: { type: string }
  brand: { type: string }
  summary: { label: Change, type: string, flags: [title, searchable] }
  pre_data: { label: Before, type: string }
  data: { label: After, type: string }
