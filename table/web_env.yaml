# yaml-language-server: $schema=./table-schema-1.json
# Web: one flag x environment with its summary lines, read-only for everyone.
# Reads flag_env directly (index on flag_name, env_key), so only the requested rows are
# computed and changes arrive live. It can't be a query table: those filter outside the query,
# which would compute detail/seen for all 15,000 rows (3 s).
# READ-ONLY BY NAMING: expr: columns are still written by the API (FEEDBACK.md), so no column
# here may share a name with a stored flag_env field - a write then names a field the
# SCHEMAFULL table doesn't have and SurrealDB refuses it. flag_name/env_key are the exception:
# the database computes them (VALUE), so writing them changes nothing.
datasource: flags
title: Flag environments (web, read)
columns:
  id: { type: string, flags: [id] }
  flag_name: { type: string, flags: [title], expr: 'surreal::expr("flag_name")' }
  env_key: { type: string, expr: 'surreal::expr("env_key")' }
  is_on: { type: bool, expr: 'surreal::expr("enabled")' }
  rule_rollout: { type: int, expr: 'surreal::expr("default_rollout")' }
  rule_allowlist: { type: string, expr: 'surreal::expr("default_allowlist")' }
  default_label: { type: string, expr: 'surreal::expr("fn::rule_label(default_rollout, default_allowlist)")' }
  detail: { type: string, expr: 'surreal::expr("fn::env_detail(id)")' }
  seen: { type: string, expr: 'surreal::expr("fn::env_seen(id)")' }
  rule_revision: { type: int, expr: 'surreal::expr("revision")' }
surreal:
  table: flag_env
