# yaml-language-server: $schema=./table-schema-1.json
# Web admin: brands (spec 05 screen 7). The web API scopes it to admins (admin_scope).
datasource: flags
title: Brands (web admin)
columns:
  id: { type: string, flags: [id] }
  key: { type: string }
  display_name: { type: string, flags: [title] }
  active: { type: bool }
  admin_scope: { type: string }
  created_at: { type: timestamp, flags: [calculated] }
surreal:
  table: brand
log_changes:
  into: audit_event
  columns: { who: created_by, at: created_at, before: pre_data, after: data }
  script: !include ../script/log_brand.rhai
